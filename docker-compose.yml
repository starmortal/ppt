version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: pptmaster-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pptmaster}
      POSTGRES_USER: ${POSTGRES_USER:-pptmaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pptmaster_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - pptmaster-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pptmaster}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: pptmaster-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - pptmaster-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: pptmaster-minio
    pull_policy: missing
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - pptmaster-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pptmaster-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pptmaster}:${POSTGRES_PASSWORD:-pptmaster_password}@postgres:5432/${POSTGRES_DB:-pptmaster}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_SECURE: "false"
    volumes:
      - ./backend:/app
      - ../../projects:/app/projects
      - ../../skills:/app/skills
    ports:
      - "8000:8000"
    networks:
      - pptmaster-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Celery Worker
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pptmaster-celery-worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pptmaster}:${POSTGRES_PASSWORD:-pptmaster_password}@postgres:5432/${POSTGRES_DB:-pptmaster}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - ./backend:/app
      - ../../projects:/app/projects
      - ../../skills:/app/skills
    networks:
      - pptmaster-network
    depends_on:
      - redis
      - postgres
    command: celery -A app.celery_app worker --loglevel=info

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pptmaster-frontend
    ports:
      - "3000:3000"
    networks:
      - pptmaster-network
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: pptmaster-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    networks:
      - pptmaster-network
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  pptmaster-network:
    driver: bridge
